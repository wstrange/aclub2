<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 606.8599999999999 683.554" width="606.8599999999999" height="683.554" style="--bg:#FFFFFF;--fg:#1E293B;--line:#64748B;--muted:#475569;--surface:#F8FAFC;--border:#CBD5E1;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="301.5775,76.9 301.5775,124.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Yes (Self-Withdrawal)" points="260.4518333333333,330.5283333333333 260.4518333333333,407.654 162.86249999999995,407.654 162.86249999999995,487.95399999999995" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="162.86249999999995,524.8539999999999 162.86249999999995,572.8539999999999" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="No (Leader / Admin Removal)" points="342.7031666666666,330.52833333333336 342.7031666666666,407.654 440.2924999999999,407.654 440.2924999999999,487.95399999999995" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="E" data-to="F" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="440.2924999999999,524.8539999999999 440.2924999999999,572.8539999999999" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="B" data-to="C" data-label="Yes (Self-Withdrawal)">
  <rect x="104.36249999999995" y="414.654" width="116.848" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="162.78649999999996" y="429.804" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Yes (Self-Withdrawal)</text>
</g>
<g class="edge-label" data-from="B" data-to="E" data-label="No (Leader / Admin Removal)">
  <rect x="364.2924999999999" y="414.654" width="151.3" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="439.9424999999999" y="429.804" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">No (Leader / Admin Removal)</text>
</g>
<g class="node" data-id="A" data-label="Registration Status updated to 'withdrawn'" data-shape="rectangle">
  <rect x="160.56049999999993" y="40" width="282.034" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="301.57749999999993" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Registration Status updated to &#39;withdrawn&#39;</text>
</g>
<g class="node" data-id="B" data-label="withdrawnByUserId == userId?" data-shape="diamond">
  <polygon points="301.5775,124.9 424.95449999999994,248.277 301.5775,371.654 178.2005,248.277" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="301.5775" y="248.277" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">withdrawnByUserId == userId?</text>
</g>
<g class="node" data-id="C" data-label="notifyTripLeadersOfWithdrawal()" data-shape="rectangle">
  <rect x="45.928" y="487.95399999999995" width="233.86899999999994" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="162.86249999999995" y="506.40399999999994" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">notifyTripLeadersOfWithdrawal()</text>
</g>
<g class="node" data-id="D" data-label="Notify Event Coordinators:
(tripLeaderIds + creatorId)
&lt;i&gt;'Member has withdrawn from Event'&lt;/i&gt;" data-shape="rectangle">
  <rect x="40" y="572.8539999999999" width="245.72499999999994" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="162.86249999999995" y="608.204" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="162.86249999999995" dy="-12.350000000000001">Notify Event Coordinators:</tspan><tspan x="162.86249999999995" dy="16.900000000000002">(tripLeaderIds + creatorId)</tspan><tspan x="162.86249999999995" dy="16.900000000000002"><tspan font-style="italic">&#39;Member has withdrawn from Event&#39;</tspan></tspan></text>
</g>
<g class="node" data-id="E" data-label="sendNotificationToUser()" data-shape="rectangle">
  <rect x="345.9584999999999" y="487.95399999999995" width="188.668" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="440.2924999999999" y="506.40399999999994" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">sendNotificationToUser()</text>
</g>
<g class="node" data-id="F" data-label="Notify Withdrawn User:
&lt;i&gt;'You have been removed from Event'&lt;/i&gt;" data-shape="rectangle">
  <rect x="313.7249999999999" y="572.8539999999999" width="253.13499999999993" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="440.2924999999999" y="599.7539999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="440.2924999999999" dy="-3.9000000000000012">Notify Withdrawn User:</tspan><tspan x="440.2924999999999" dy="16.900000000000002"><tspan font-style="italic">&#39;You have been removed from Event&#39;</tspan></tspan></text>
</g>
</svg>