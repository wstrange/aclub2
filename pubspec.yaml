name: aclub2
description: Main Flutter frontend.
version: 1.0.0+1
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  bloc_signals: ^1.7.0
  bloc_signals_flutter: ^1.5.0
  cached_network_image: ^4.0.5
  cloud_firestore: ^7.1.0
  cupertino_icons: ^2.0.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_facebook_auth: ^7.2.0
  flutter_hooks: ^0.21.3+1
  flutter_markdown_plus: ^1.0.12
  freezed_annotation: ^3.1.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  json_annotation: ^4.12.0
  kaisel: ^1.1.0
  logging: ^1.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^13.3.1
  shared_models:
    path: packages/shared_models
  url_launcher: ^6.3.3

# The published facebook_auth_desktop only ships a CocoaPods .podspec for its
# macOS plugin, and this project is Swift-Package-Manager-only. The vendored
# copy below adds Package.swift (see packages/facebook_auth_desktop/README.md).
dependency_overrides:
  facebook_auth_desktop:
    path: packages/facebook_auth_desktop

dev_dependencies:
  bloc_signals_devtools: ^1.0.3
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  image: ^4.12.0
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/waiver.md
    - assets/icon/

# Launcher icon generation (see tool/generate_app_icon.dart for the art).
# Regenerate assets with `dart run tool/generate_app_icon.dart`, then apply
# them with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  # Source art: 1024×1024 rounded crimson field with the snow-capped massif.
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  web:
    generate: false
  windows:
    generate: false