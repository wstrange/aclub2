  sdk: '>=3.13.0 <4.0.0'

dependencies:
  cloud_firestore: ^6.9.0
  firebase_core: ^4.14.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter:
    sdk: flutter
  firebase_auth: ^6.6.1
